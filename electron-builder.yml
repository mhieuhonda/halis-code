appId: com.mhieuhonda.haliscode
productName: Halis Code
copyright: Copyright © 2026 mhieuhonda
directories:
  buildResources: build
  output: release
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: resources/ponytail
    to: ponytail
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
compression: maximum
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
