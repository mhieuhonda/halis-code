<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Halis Code</title>
    <link rel="icon" type="image/png" href="./src/assets/favicon.png" />
    <!-- The renderer makes no direct network calls (everything goes through
         IPC to the main process) — connect-src stays 'self' so a stray script
         cannot exfiltrate to arbitrary hosts. Vite's HMR client is same-origin. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" />
    <meta name="color-scheme" content="light dark" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
