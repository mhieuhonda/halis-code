name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  APK_DIR: android/android/app/build/outputs/apk
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null 2>&1 || true
          sdkmanager --list_installed 2>/dev/null | head -20 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/android/**/*.gradle*', 'android/android/gradle/wrapper/*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: android
        run: npm ci

      - name: Typecheck (TypeScript 7)
        working-directory: android
        run: npm run typecheck

      - name: Build web assets
        working-directory: android
        run: npm run build

      - name: Sync Capacitor
        working-directory: android
        run: npx cap sync android

      - name: Decode signing keystore
        if: ${{ github.event_name == 'release' && env.HAS_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        working-directory: android/android
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > keystore.properties

      - name: Build debug APK
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK (signed when keystore present)
        if: ${{ github.event_name == 'release' }}
        working-directory: android/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p apk-out
          cp "$APK_DIR"/debug/app-debug.apk apk-out/Halis-Code-debug.apk
          if [ -f "$APK_DIR"/release/app-release.apk ]; then
            cp "$APK_DIR"/release/app-release.apk apk-out/Halis-Code-release.apk
          fi
          ls -la apk-out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: halis-code-android
          path: apk-out/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" apk-out/*.apk --clobber --repo "$GITHUB_REPOSITORY"
